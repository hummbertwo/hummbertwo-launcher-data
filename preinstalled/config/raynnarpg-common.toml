#Settings for Server
[server_settings]
	#Fine adjust the xp rate of server.
	# Default: 1.0
	# Range: 0.01 ~ 100.0
	xp_rate = 1.0
	#Fine adjust the max level of each skill in server.
	# Default: 50
	# Range: > 1
	max_level = 50
	#Fine adjust the max xp of each skill in server.
	# Default: 303000
	# Range: 1 ~ 100000000
	max_xp = 303000
	#Fine adjust the level difference for xp cap of each skill in server.
	#0 for disabled.
	#For example, if you are level 40, and diamond ore is level 20, and you have level cap of 20, you will not gain xp, changing this to level cap 10, will make so you gain xp until level 30, as an example.
	# Default: 0
	# Range: > 0
	level_cap = 0
	#Fine adjust the base xp for mining skill in server.
	#This setting is to increase the starting xp for materials.
	# Default: 3.0
	# Range: 0.1 ~ 1000.0
	base_mining_xp = 3.0
	#Fine adjust the base xp for smelting skill in server.
	#This setting is to increase the starting xp for materials.
	# Default: 3.0
	# Range: 0.1 ~ 1000.0
	base_smelting_xp = 3.0
	#Fine adjust the base xp for crafting skill in server.
	#This setting is to increase the starting xp for materials.
	# Default: 3.0
	# Range: 0.1 ~ 1000.0
	base_crafting_xp = 3.0

